<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>HEN Army Map</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #map {
      width: 100%;
      height: 100vh;
      min-height: 500px;
    }

    #mapError {
      display: none;
      box-sizing: border-box;
      padding: 24px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #a00000;
      background: #fff4f4;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="mapError"></div>

  <script>
    const BASE_URL =
      "https://racheldoyle-sys.github.io/hen-army-map/";

    function showError(message) {
      const errorBox = document.getElementById("mapError");

      errorBox.textContent = message;
      errorBox.style.display = "block";

      console.error("[HEN Army Map]", message);
    }

    function postToWix(payload) {
      try {
        window.parent.postMessage(payload, "*");
      } catch (error) {
        console.warn(
          "[HEN Army Map] Unable to message parent:",
          error
        );
      }
    }

    function loadScript(filename) {
      return new Promise(function (resolve, reject) {
        const script = document.createElement("script");

        script.src =
          BASE_URL +
          filename +
          "?v=" +
          Date.now();

        script.onload = function () {
          console.log(
            "[HEN Army Map] Loaded:",
            filename
          );

          resolve();
        };

        script.onerror = function () {
          reject(
            new Error("Unable to load " + filename)
          );
        };

        document.body.appendChild(script);
      });
    }

    function getLocationName(locationId) {
      const mapData =
        window.simplemaps_namap_mapdata;

      if (
        !mapData ||
        !mapData.locations ||
        !mapData.locations[String(locationId)]
      ) {
        return "";
      }

      return (
        mapData.locations[String(locationId)].name ||
        ""
      );
    }

    function attachHooks() {
      if (
        !window.simplemaps_namap ||
        !window.simplemaps_namap.hooks
      ) {
        window.setTimeout(attachHooks, 50);
        return;
      }

      window.simplemaps_namap.hooks.click_location =
        function (id) {
          const locationId = String(id);
          const name = getLocationName(locationId);

          console.log(
            "[HEN Army Map] Marker clicked:",
            locationId,
            name
          );

          postToWix({
            type: "henArmyRepClicked",
            map: "na",
            locationId: locationId,
            name: name
          });
        };

      postToWix({
        type: "henPing",
        map: "na"
      });

      console.log(
        "[HEN Army Map] North America map ready."
      );
    }

    loadScript("mapdata.js")
      .then(function () {
        if (!window.simplemaps_namap_mapdata) {
          throw new Error(
            "mapdata.js loaded, but simplemaps_namap_mapdata was not found."
          );
        }

        return loadScript("namap.js");
      })
      .then(function () {
        if (!window.simplemaps_namap) {
          throw new Error(
            "namap.js loaded, but simplemaps_namap was not created."
          );
        }

        attachHooks();
      })
      .catch(function (error) {
        showError(error.message);

        postToWix({
          type: "henHtmlError",
          map: "na",
          message: error.message
        });
      });
  </script>
</body>
</html>
