<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>HEN Army Map</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    function postToWix(payload) {
      try {
        window.parent.postMessage(payload, "*");
      } catch (error) {
        console.error("[HEN Army NA] Parent postMessage error:", error);
      }

      try {
        window.top.postMessage(payload, "*");
      } catch (error) {
        console.error("[HEN Army NA] Top postMessage error:", error);
      }
    }

    function loadScript(src, callback) {
      const script = document.createElement("script");

      script.src = src;
      script.onload = callback;

      script.onerror = function () {
        console.error("[HEN Army NA] Failed to load:", src);

        postToWix({
          type: "henHtmlError",
          map: "na",
          message: "Failed to load: " + src
        });
      };

      document.body.appendChild(script);
    }

    function getLocationName(locationId) {
      try {
        const locations =
          window.simplemaps_namap_mapdata &&
          window.simplemaps_namap_mapdata.locations;

        const location = locations && locations[String(locationId)];

        return location && location.name
          ? String(location.name)
          : "";
      } catch (error) {
        console.warn(
          "[HEN Army NA] Unable to retrieve location name:",
          error
        );

        return "";
      }
    }

    function attachHooks() {
      if (
        !window.simplemaps_namap ||
        !window.simplemaps_namap.hooks
      ) {
        window.setTimeout(attachHooks, 50);
        return;
      }

      window.simplemaps_namap.hooks.click_location = function (id) {
        const locationId = String(id);
        const name = getLocationName(locationId);

        console.log(
          "[HEN Army NA] Marker clicked:",
          locationId,
          name
        );

        postToWix({
          type: "henArmyRepClicked",
          map: "na",
          locationId: locationId,
          name: name
        });
      };

      console.log("[HEN Army NA] Map hooks attached.");

      postToWix({
        type: "henPing",
        map: "na"
      });
    }

    const version = Date.now();

    loadScript(
      "mapdata.js?v=" + version,
      function () {
        loadScript(
          "namap.js?v=" + version,
          function () {
            attachHooks();
          }
        );
      }
    );
  </script>
</body>
</html>
